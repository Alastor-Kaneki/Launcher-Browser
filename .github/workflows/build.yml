name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Launcher-Browser-0.1.0-alpha-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Launcher-Browser-0.1.0-alpha-debug
          path: Launcher-Browser-0.1.0-alpha-debug.apk
          if-no-files-found: error
          retention-days: 30
