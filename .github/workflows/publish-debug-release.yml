name: Publish Debug Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/release-debug-trigger'

permissions:
  contents: write

concurrency:
  group: launcher-browser-debug-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.3-alpha-debug
      RELEASE_TITLE: Launcher Browser 0.1.3 Alpha — Debug
      APK_NAME: Launcher-Browser-0.1.3-alpha-debug.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: launcher-browser-debug-keystore-v1

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## Launcher Browser 0.1.3 Alpha — Debug

          Widget isolation, userscripts, and Lite Extensions.

          ### Widget stability
          - Removes third-party widget inflation from the launcher process
          - Adds Widget Space in its own `:widgets` process
          - Quarantines the widget that failed during the previous load
          - Adds a one-tap Widget Space reset without affecting the launcher

          ### Browser power tools
          - Adds userscript and CSS userstyle import, editing, enable/disable, matching, and exclusions
          - Supports `@name`, `@match`, `@include`, and `@exclude`
          - Adds `GM_addStyle` and `GM_log`
          - Adds Lite Extensions for basic ad/tracker blocking, dark pages, and cookie-banner hiding
          - Recovers from WebView renderer crashes

          ### Signing
          This debug-release workflow now caches one repository-specific debug keystore for future debug updates. Android may require uninstalling 0.1.2 or older because those builds used changing CI debug keys.
          NOTES

      - name: Create or update debug prerelease
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TITLE" --notes-file release-notes.md --prerelease
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file release-notes.md --prerelease
          fi
