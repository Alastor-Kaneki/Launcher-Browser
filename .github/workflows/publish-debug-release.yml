name: Publish Debug Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/release-debug-trigger'

permissions:
  contents: write

concurrency:
  group: launcher-browser-debug-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.4-alpha-debug
      RELEASE_TITLE: Launcher Browser 0.1.4 Alpha — Debug
      APK_NAME: Launcher-Browser-0.1.4-alpha-debug.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: launcher-browser-debug-keystore-v1

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## Launcher Browser 0.1.4 Alpha — Debug

          Native Opera GX mod downloading is now built directly into Launcher Browser.

          ### Native GX downloader
          - Shows a native **GX** button on Opera GX Store mod pages
          - Scans the loaded page and WebView resource list for the official package URL
          - Falls back to resolving the package from GX Store HTML
          - Downloads the untouched official `.crx`
          - Converts CRX2/CRX3 packages into a usable raw `.zip`
          - Saves ZIP files to `Downloads/Launcher Browser`
          - Copies the official GX CDN package URL
          - Accepts GX Store links shared into Launcher Browser
          - Restricts package downloads to official GX CDN hosts
          - Never installs or activates downloaded mods

          ### Existing features
          - Isolated Widget Space
          - Userscripts and CSS userstyles
          - Lite Extensions
          - Shizuku shell and launcher tools

          ### Signing
          This release uses the persistent repository debug signing key established in 0.1.3, so it should install as an update over 0.1.3.
          NOTES

      - name: Create or update debug prerelease
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TITLE" --notes-file release-notes.md --prerelease
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file release-notes.md --prerelease
          fi
