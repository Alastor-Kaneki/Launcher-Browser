plugins { id 'com.android.application' }

android {
    namespace 'dev.alastorkaneki.launcherbrowser'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.alastorkaneki.launcherbrowser'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-alpha'
    }
    def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
    signingConfigs {
        release {
            if (keystorePath != null && !keystorePath.isBlank()) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (keystorePath != null && !keystorePath.isBlank()) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
    buildFeatures { aidl true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1'] }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
